name: Express Book Review Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: final_project

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Start server
        run: |
          node index.js > server.log 2>&1 &
          sleep 3

      - name: Get all books
        run: curl -f http://localhost:5000/

      - name: Get book by ISBN
        run: curl -f http://localhost:5000/isbn/1

      - name: Get books by author
        run: curl -f "http://localhost:5000/author/Chinua%20Achebe"

      - name: Get books by title
        run: curl -f "http://localhost:5000/title/Things%20Fall%20Apart"

      - name: Get reviews
        run: curl -f http://localhost:5000/review/1

      - name: Register user
        run: |
          curl -f -X POST http://localhost:5000/register             -H "Content-Type: application/json"             -d '{"username":"testuser","password":"testpass"}'

      - name: Login and save session cookie
        run: |
          curl -f -c cookie.txt -X POST http://localhost:5000/customer/login             -H "Content-Type: application/json"             -d '{"username":"testuser","password":"testpass"}'

      - name: Add review
        run: |
          curl -f -b cookie.txt -X PUT http://localhost:5000/customer/auth/review/1             -H "Content-Type: application/json"             -d '{"review":"Excellent book"}'

      - name: Verify review
        run: curl -f http://localhost:5000/review/1

      - name: Delete review
        run: curl -f -b cookie.txt -X DELETE http://localhost:5000/customer/auth/review/1

      - name: Verify deletion
        run: curl -f http://localhost:5000/review/1
